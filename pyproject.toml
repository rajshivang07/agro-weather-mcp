[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agro-weather-mcp"
version = "0.1.0"
description = "Agriculture-focused weather tools for LLMs using Open-Meteo"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "agro-weather-mcp contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.13,<2",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.8",
]

[project.scripts]
agro-weather-mcp = "agro_weather_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agro_weather_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: requires network access and RUN_LIVE=1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
